# ═══════════════════════════════════════════════════════════════════════════════
#  AMC Business Management — Shared Application Configuration
#
#  This file contains ONLY non-sensitive, shared settings.
#  All secrets and environment-specific values live in profile files:
#
#    application-dev.properties      → local development  (git-ignored)
#    application-prod.properties     → production         (git-ignored)
#
#  To run locally:
#    mvn spring-boot:run -Dspring-boot.run.profiles=dev
#  Or set the environment variable:
#    SPRING_PROFILES_ACTIVE=dev
# ═══════════════════════════════════════════════════════════════════════════════

# Active profile — override via SPRING_PROFILES_ACTIVE env var in production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Server ────────────────────────────────────────────────────────────────────
server.port=3000

# ── MongoDB ───────────────────────────────────────────────────────────────────
spring.data.mongodb.database=amc_business

# ── JWT defaults (overridden per profile) ─────────────────────────────────────
# Access token: 8 hours
app.jwt.expiration-ms=28800000
# Refresh token: 7 days
app.jwt.refresh-expiration-ms=604800000

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
